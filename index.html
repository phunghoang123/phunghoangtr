<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Loading...</title>
<style>
*{
    margin:0;
    padding:0;
    overflow:hidden;
}
body{
    background:#000;
    font-family:Consolas,monospace;
}
canvas{
    position:fixed;
    top:0;
    left:0;
}

#love{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    color:#ff3366;
    font-size:90px;
    font-weight:bold;
    text-shadow:
        0 0 20px #ff3366,
        0 0 40px #ff3366,
        0 0 70px #ff3366;
    opacity:0;
    transition:all 2s;
    text-align:center;
    white-space:nowrap;
    z-index:10;
}

.show{
    opacity:1!important;
    transform:translate(-50%,-50%) scale(1)!important;
}

.small{
    display:block;
    font-size:35px;
    margin-top:25px;
    color:white;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="love">
I LOVE YOU ❤️
<span class="small">Will you be mine?</span>
</div>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

const letters="I LOVE YOU";
const size=18;

const columns=Math.floor(canvas.width/size);
const drops=[];

for(let i=0;i<columns;i++)
    drops[i]=1;

function draw(){

    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#ff4f9a";
    ctx.font=size+"px monospace";

    for(let i=0;i<drops.length;i++){

        const text=letters[Math.floor(Math.random()*letters.length)];

        ctx.fillText(text,i*size,drops[i]*size);

        if(drops[i]*size>canvas.height && Math.random()>0.975)
            drops[i]=0;

        drops[i]++;
    }

}

const rain=setInterval(draw,35);

// Sau 5 giây hiện chữ
setTimeout(()=>{

    // Làm tối màn hình dần
    let alpha=0;

    const fade=setInterval(()=>{

        alpha+=0.02;

        ctx.fillStyle=`rgba(0,0,0,${alpha})`;
        ctx.fillRect(0,0,canvas.width,canvas.height);

        if(alpha>=1){
            clearInterval(fade);
            clearInterval(rain);

            document.getElementById("love").classList.add("show");

        }

    },30);

},5000);

window.onresize=()=>{
    canvas.width=innerWidth;
    canvas.height=innerHeight;
};

</script>

</body>
</html>
